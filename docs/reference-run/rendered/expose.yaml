# NodePort services targeting the (single) REC pod. kind maps these node ports to
# 127.0.0.1 on the host (see kind-config.yaml.tpl). The operator's own
# services are ClusterIP only, so these are separate, unmanaged services.
apiVersion: v1
kind: Service
metadata:
  name: kvcache-nodeport
  namespace: redis
spec:
  type: NodePort
  selector:
    app: redis-enterprise
    redis.io/cluster: rec
    redis.io/role: node
  ports:
    - name: redis
      port: 12000
      targetPort: 12000
      nodePort: 32000
---
apiVersion: v1
kind: Service
metadata:
  name: rec-api-nodeport
  namespace: redis
spec:
  type: NodePort
  selector:
    app: redis-enterprise
    redis.io/cluster: rec
    redis.io/role: node
  ports:
    - name: api
      port: 9443
      targetPort: 9443
      nodePort: 30943
---
apiVersion: v1
kind: Service
metadata:
  name: rec-ui-nodeport
  namespace: redis
spec:
  type: NodePort
  selector:
    app: redis-enterprise
    redis.io/cluster: rec
    redis.io/role: node
  ports:
    - name: ui
      port: 8443
      targetPort: 8443
      nodePort: 30443
